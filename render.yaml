# Render Blueprint: Dashboard → New → Blueprint → pick this repo.
databases:
  - name: tend-weekly-db
    plan: basic-256mb
    databaseName: garden
    user: garden

services:
  - type: web
    name: tend-weekly
    runtime: node
    plan: starter
    buildCommand: npm ci && npm run build
    startCommand: npm run db:migrate && npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: tend-weekly-db
          property: connectionString
      - key: AUTH_SECRET
        generateValue: true
      - key: CRON_SECRET
        generateValue: true
      - key: APP_URL # e.g. https://tendweekly.com (or tend-weekly.onrender.com before the domain is set up)
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM # e.g. Tend Weekly <hello@tendweekly.com>
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false

  # Hourly from Thursday to Saturday (UTC). The app only emails each user once,
  # at or after 7am on Friday in their own timezone, so every timezone is covered.
  - type: cron
    name: tend-weekly-friday-email
    runtime: node
    plan: starter
    schedule: "5 * * * 4,5,6"
    buildCommand: echo "no build needed"
    startCommand: curl -fsS -X POST -H "Authorization: Bearer $CRON_SECRET" "$APP_URL/api/cron/weekly"
    envVars:
      - key: CRON_SECRET
        fromService:
          type: web
          name: tend-weekly
          envVarKey: CRON_SECRET
      - key: APP_URL
        sync: false
